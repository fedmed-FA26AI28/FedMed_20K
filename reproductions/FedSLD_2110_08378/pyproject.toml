[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedsld-reproduction"
version = "0.1.0"
description = "Independent reconstruction of FedSLD (ISBI 2022)"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "medmnist",
  "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fedsld_reproduction*"]

