# ==============================================================================
# FedMedAI: Multi-Strategy & Multi-Partition Simulation Configuration
# ==============================================================================
# This configuration file is the single source of truth for running automated FL
# simulations with `python -m experiments.run_simulation`.
#
# Execution:
#     python -m experiments.run_simulation
#     (or custom config: python -m experiments.run_simulation --config configs/simulation.yaml)
# ==============================================================================

# --- Simulation Topology & Matrix Grid ---
# Number of simulated clients participating in federated training
num_clients: 12

# Datasets to benchmark:
# Available options: 'bloodmnist', 'pathmnist', 'organamnist', 'dermamnist'
datasets:
  - pathmnist

# Non-IID data partition modes to benchmark:
# Available options:
#   - 'practical'    : Shards per class simulating clinical distribution imbalance (FedSLD ISBI 2022)
#   - 'pathological' : Each client receives a small subset of classes (FedSLD ISBI 2022)
#   - 'dirichlet_X.X': Dirichlet label distribution (e.g. dirichlet_0.3, dirichlet_0.1, dirichlet_1.0)
partitions:
  - practical

# FL aggregation strategies to benchmark:
# Available options:
#   - 'fedavg'   : Vanilla Federated Averaging (McMahan et al., 2017)
#   - 'fedprox'  : Proximal regularization for system heterogeneity (Li et al., 2020)
#   - 'fednova'  : Normalized averaging for step heterogeneity (Wang et al., 2020)
#   - 'fedbn'    : Local Batch Normalization for domain/feature shift (Li et al., 2021)
#   - 'scaffold' : Control variates for client drift (Karimireddy et al., 2020)
#   - 'proposed' : Proposed Strategy: FedBN + SCAFFOLD (alias: 'fedbn_scaffold')
strategies:
  - proposed

# --- Training Hyperparameters ---
rounds: 40                        # Total federated communication rounds
local_epochs: 5                   # Local training epochs on each client per round
batch_size: 256                   # Client training mini-batch size
learning_rate: 0.01               # Base initial learning rate
model: cnn                        # Architecture: 'cnn' (Modern ~20K params with BatchNorm), 'baseline' (~570K params without BN), or 'baseline_bn' (~571K params with BN)
optimizer: adam                   # Optimizer: 'adam' or 'sgd'
momentum: 0.0                     # SGD momentum (0.0 for pure SGD)
weight_decay: 1e-4                # L2 regularization penalty (0.0 = none)
seed: 42                          # Random seed for partition and initialization reproducibility

# --- Data Augmentation (Training split only) ---
augment: true                     # Toggle training data augmentation
random_crop: true                 # Random crop with reflection padding
random_flip: true                 # Random horizontal flip

# --- Learning Rate (LR) Scheduling Mode ---
# Options:
#   'fixed'       : Constant learning rate across all rounds and clients
#   'client_loss' : Server provides initial LR; each client independently reduces LR on local loss plateau
#   'server_decay': Server computes global step decay every N rounds
lr_mode: fixed

# Settings for 'client_loss' mode:
client_lr_patience: 2             # Local epochs without improvement before reducing LR
client_lr_factor: 0.5             # Multiplicative factor of LR reduction
client_lr_min: 0.00001           # Minimum learning rate lower bound

# Settings for 'server_decay' mode:
lr_decay_steps: 8                 # Decay learning rate every N rounds
lr_decay_gamma: 0.5               # Multiplicative decay factor
server_lr_min: 0.00001            # Minimum learning rate lower bound for server decay (prevents LR starvation)

# --- Algorithm-Specific Hyperparameters ---
proximal_mu: 0.01                 # FedProx proximal coefficient (0.0 = FedAvg)

# --- Server Evaluation & Metrics Tracking ---
server_eval: true                 # Centralized evaluation on global test set
local_test: true                  # Partition test set across clients and track BMCTA/BTA (FedSLD metric)
early_stop_patience: 0            # Rounds without improvement before stopping (0 = disabled)
early_stop_metric: accuracy       # Target metric to monitor: 'accuracy' or 'loss'

# --- Hardware, Multi-process & Resource Management ---
device: auto                      # Compute device: 'auto', 'cuda', or 'cpu'
device_type: pc                   # Hardware profile for client monitoring ('pc', 'jetson_orin', 'jetson_nano')
pin_memory: true                  # Pinned host memory for faster CUDA data transfer
num_workers: 0                    # DataLoader workers (0 is safest for multi-process simulation on Windows)
client_cpu_threads: 1             # PyTorch CPU threads per client subprocess (avoids CPU oversubscription)

# Client execution engine:
#   'client.client'                : Parallel execution across all clients concurrently
#   'experiments.simulation_client': Sequential execution with GPU file lock (for low VRAM systems)
client_module: client.client

# --- Network & Execution Control ---
server_host: "127.0.0.1"          # Host address for FL server socket
timeout_per_run: 0                # Maximum timeout in seconds per run (<=0 disables timeout)
auto_partition: true              # Automatically generate missing partition JSON files if not present
save_client_metrics: true         # Record per-client ping and epoch metrics CSVs

# --- Output & Logging ---
output_dir: results/simulation    # Base directory for simulation run logs, summary CSVs, and plots
name: null                        # Optional designated simulation run name (defaults to timestamp)
generate_comparison_plots: true   # Generate cross-strategy accuracy/loss curves, bar charts, and heatmap
