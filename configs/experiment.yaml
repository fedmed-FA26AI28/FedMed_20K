# ==============================================================================
# FedMedAI: Real Multi-Device Client Experiment Configuration
# ==============================================================================
# This configuration file defines parameters for live physical distributed FL
# execution across multiple machines / edge devices (e.g., PC server, PC clients,
# and NVIDIA Jetson edge nodes communicating over LAN sockets).
#
# Execution:
#   Server: python -m server.server --config configs/experiment.yaml
#   Client: python -m client.client --config configs/experiment.yaml --client_id <ID> --server_address <SERVER_IP>:8080
# ==============================================================================

# --- Dataset and Architecture ---
# Supported datasets: 'bloodmnist', 'pathmnist', 'organamnist', 'dermamnist'
dataset: pathmnist
# Supported models: 'cnn' (Modern ~20K params with BatchNorm), 'baseline_bn' (FedSLD CNN with BatchNorm), or 'baseline' (Classic CNN without BatchNorm)
model: baseline_bn
optimizer: sgd                   # Client optimizer: 'adam', 'sgd', or 'adamw'
momentum: 0.9                     # SGD momentum (0.0 for pure SGD)
weight_decay: 1e-4                # L2 regularization penalty (0.0 to disable)
seed: 42                          # Global random seed for reproducibility
name: null                        # Optional designated run folder name (defaults to timestamp)

# --- Data Augmentation (Training split only) ---
augment: false                     # Toggle training data augmentation
random_crop: false                 # Random crop with reflection padding
random_flip: false                 # Random horizontal flip

# --- Partitioning Configuration ---
# Partition mode: 'practical', 'pathological', 'dirichlet_0.3', 'dirichlet_0.1', 'dirichlet_1.0'
partition_mode: practical
partition_save_dir: data/partitions
num_clients: 12                   # Total number of physical clients participating in the federation
min_clients: 12                   # Minimum connected clients before server starts the round

# --- Server & FL Training Hyperparameters ---
# Supported strategies: 'fedavg', 'fedprox', 'fednova', 'fedbn', 'scaffold', 'fedbns', 'proposed', 'scr', 'fedsld', 'fedsol', 'fedswitch'
strategy: fedbns
rounds: 40                        # Total federated communication rounds
fl_rounds: 40                     # Alias for rounds
local_epochs: 5                   # Local training epochs per round on each client
batch_size: 256                   # Client DataLoader mini-batch size (set integer or null to inherit per-device hardware profile from configs/jetson.yaml)
learning_rate: 0.01               # Initial base learning rate

# --- Learning Rate (LR) Scheduling Mode ---
# Options:
#   'fixed'       : Constant learning rate across all rounds
#   'client_loss' : Server provides initial LR; each client reduces LR on local plateau
#   'server_decay': Server computes step decay every N rounds
lr_mode: fixed

# Settings for 'client_loss' mode:
client_lr_patience: 2             # Local epochs without improvement before reducing LR
client_lr_factor: 0.5             # Multiplicative factor of LR reduction
client_lr_min: 0.000001           # Minimum learning rate bound

# Settings for 'server_decay' mode:
lr_decay_steps: 3                 # Decay learning rate every N rounds
lr_decay_gamma: 0.5               # Multiplicative decay factor
server_lr_min: 0.00001            # Minimum learning rate lower bound for server decay

# --- Evaluation & Early Stopping ---
local_test: true                  # Evaluate on client-specific local test partition (BMCTA / BTA tracking)
server_eval: true                 # Evaluate on global server test set each round
early_stop_patience: 0            # Rounds without improvement before stopping (0 = disabled)
early_stop_metric: accuracy       # Target metric to monitor: 'accuracy' or 'loss'

# --- Algorithm-Specific Hyperparameters ---
proximal_mu: 0.01                 # FedProx proximal coefficient (0.0 = FedAvg)
# CLA v2 (Minimalist AdaCoverage + Prior-Aligned LA - 1 Hyperparameter `mu`):
mu: 0.1                           # Single primary hyperparameter: Coverage penalty intensity (default: 0.1)
use_la: true                      # Toggle Logit Adjustment (default: true)
la_mode: prior_aligned            # LA mode: 'prior_aligned' (Bayes Log-Odds v2) or 'v1_legacy'
adaptive_kappa: true              # Adaptive Empirical Bayes shrinkage a_{k,c} = n_k / (C*n_{k,c} + n_k) (default: true)
multi_linear_coverage: true       # Back-projected coverage across all nn.Linear layers (default: true)
disable_covered_wd: true          # Disable weight decay on covered Linear layers (default: true)
bn_mode: pooled_global            # BatchNorm variance aggregation: 'pooled_global', 'naive_avg', 'local_bn'
# Legacy backward-compatible parameters:
coverage_kappa: 512.0             # Legacy kappa (used if adaptive_kappa=false)
coverage_mu_head: 0.1             # Legacy alias for mu
la_tau: 1.0                       # Legacy tau (used if la_mode='v1_legacy')
la_epsilon: 1.0                   # Legacy epsilon (used if la_mode='v1_legacy')
scr_gamma: 1.0                    # SCR support smoothing, kappa_c = gamma * n_c / K
scr_head_lambda: 0.01             # SCR classifier-row anchor strength
fedsld_epsilon: 1.0e-6            # FedSLD label skew smoothing epsilon
fedsld_reduction: mean            # FedSLD loss reduction mode ('mean' or 'sum')

# FedSOL (Self-Centered Optimization via Sharpness-Aware Minimization)
fedsol_rho: 2.0                   # SAM perturbation radius rho (paper Table 4/5 default = 2.0)
fedsol_target: head               # Perturbation target: 'head' (paper Sec 3.4 default) or 'all'
fedsol_loss_type: kl              # Proximal discrepancy loss metric: 'kl' or 'l2'
fedsol_temperature: 3.0           # Softmax temperature T for KL divergence
fedsol_adaptive: false            # Adaptive perturbation radius

# FedSwitch (Stage-Switching Federated Learning with DP Histogram Estimation)
switch_round: null                # Fixed switching round R* (null = auto-computed via closed form, with 25% warm-up if m >= N)
fedswitch_weighting_mode: bounded_sum # Aggregation weights: 'bounded_sum' (paper Eq. 6) or 'stratified'
fedswitch_coverage: 0.9           # Target client coverage probability rho for closed-form R*
fedswitch_epsilon: 1.0            # Differential Privacy budget epsilon for label histogram
fedswitch_c_bound: 50             # Sensitivity clipping bound C for DP Laplace noise

# Gradient Clipping (disabled by default = null so prior runs are never modified)
clip_grad_norm: null              # Maximum L2 norm for gradient clipping (null = disabled)

# --- Hardware & Client Execution ---
device_type: pc                   # Hardware profile: 'pc', 'jetson_orin', 'jetson_nano'
num_workers: 0                    # DataLoader workers (0 is safest for socket clients)
pin_memory: true                  # Pinned memory for CUDA transfer acceleration
save_metrics: true                # Save local client CSV metrics and ping logs

# --- Network & Server Communication ---
server_host: "0.0.0.0"            # Server socket bind host ("0.0.0.0" to listen on all interfaces)
server_port: 8080                 # Server listen port
server_address: "127.0.0.1:8080"  # Target server address used by clients connecting over LAN

# --- Physical Deployment Topology (PC & Jetson Cluster) ---
# Defines device profile resolution across participating hardware nodes:
#   pc           : Standard PC / laptop clients
#   orin_only    : Jetson Orin edge nodes
#   nano_only    : Jetson Nano edge nodes
#   heterogeneous: Mixed PC + Jetson cluster (resolved via configs/jetson.yaml)
deployment_mode: heterogeneous

# Active client IDs participating in this physical deployment (null = all registered clients)
active_clients: null

# ──────────────────────────────────────────────────────────────────────────────
# Centralized Baseline Training (experiments/train_centralized.py)
# ──────────────────────────────────────────────────────────────────────────────
centralized:
  dataset: pathmnist              # Options: 'bloodmnist', 'pathmnist', 'organamnist', 'dermamnist'
  model: baseline_bn                 # Options: 'baseline' (FedSLD classic CNN), 'baseline_bn' (Baseline with BN), or 'cnn' (Modern)
  optimizer: sgd                  # Options: 'sgd', 'adam', or 'adamw'
  momentum: 0.9
  epochs: 100
  batch_size: 256
  learning_rate: 0.01
  lr_patience: 0
  lr_factor: 0.5
  min_lr: 0.000001
  early_stop_patience: 0
  seed: 42
  name: null

centralized_epochs: 100
centralized_batch_size: 256
centralized_learning_rate: 0.01
centralized_early_stop_patience: 0
centralized_lr_patience: 0
centralized_lr_factor: 0.5
centralized_min_lr: 0.000001
