# ==============================================================================
# Hardware Profiling Configuration for Edge Devices
# ==============================================================================
# client.py resolves device_type from client_id via client_registry below.

# ──────────────────────────────────────────────────────────────────────────────
# PC / Laptop (Simulation Mode: all clients run on a single host machine)
# ──────────────────────────────────────────────────────────────────────────────
pc:
  device_type: pc
  batch_size: 32
  num_workers: 0      # 0 = load in main process, avoids Windows multiprocessing spawn crashes
  pin_memory: true    # Accelerates CUDA host-to-device memory transfer on PC

# ──────────────────────────────────────────────────────────────────────────────
# NVIDIA Jetson AGX Orin
# RAM: 16-32 GB | CPU: 12-core Arm | GPU: Ampere
# ──────────────────────────────────────────────────────────────────────────────
jetson_orin:
  device_type: jetson_orin
  batch_size: 32
  num_workers: 2      # Orin has ample compute resources for multiple workers
  pin_memory: false   # Jetson uses Unified Memory (shared CPU+GPU), pin_memory not required

# ──────────────────────────────────────────────────────────────────────────────
# NVIDIA Jetson Nano
# RAM: 4 GB (shared CPU+GPU) | CPU: 4-core Arm Cortex-A57
# ──────────────────────────────────────────────────────────────────────────────
jetson_nano:
  device_type: jetson_nano
  batch_size: 16      # Reduced batch size to prevent OOM on 4GB memory
  num_workers: 0      # 0 = load data in main process, avoids multiprocessing OOM
  pin_memory: false   # Unified Memory, pin_memory not required

# ──────────────────────────────────────────────────────────────────────────────
# Client Registry: client_id -> device_type
# Single source of truth for the 10-device physical cluster.
# Matches JETSON_CLIENTS in scripts/distribute_data.py
# ──────────────────────────────────────────────────────────────────────────────
client_registry:
  0: jetson_orin
  1: jetson_orin
  2: jetson_orin
  3: jetson_orin
  4: jetson_orin
  5: jetson_nano
  6: jetson_nano
  7: jetson_nano
  8: jetson_nano
  9: jetson_nano
